      }

      function northHoles(w) {
        if (w >= 9) {
          const ww = 2.2;
          return [w * 0.27, w * 0.73].map((cx) => ({
            x0: cx - ww / 2,
            x1: cx + ww / 2,
            cx,
            ww,
          }));
        }
        const ww = Math.min(3.25, w * 0.54);
        const cx = w / 2;
        return [{ x0: cx - ww / 2, x1: cx + ww / 2, cx, ww }];
      }

      function sideHole(d) {
        const wz = Math.min(1.9, d * 0.48);
        const cz = d * 0.64;
        return { z0: cz - wz / 2, z1: cz + wz / 2, cz, wz };
      }

      function addPanels(along, fixed, length, hole, side) {
        const n = Math.max(2, Math.round(length / 1.8));
        const gap = 0.12;
        const span = length - gap * (n + 1);
        const pw = span / n;
        for (let i = 0; i < n; i += 1) {
          const offset = gap + pw / 2 + i * (pw + gap);
          if (along === 'z') {
            const half = pw * 0.45;
            if (hole && offset + half > hole.z0 && offset - half < hole.z1) continue;
            box(roomRoot, mats.panel, 0.035, 1.55, pw * 0.9, fixed, 1.28, offset, { cast: false, wall: side });
          } else {
            box(roomRoot, mats.panel, pw * 0.9, 1.55, 0.035, offset, 1.28, fixed, { cast: false, wall: side });
          }
        }
      }

      function addWindow(axis, x, y, z, width, height, side) {
        const f = 0.05;
        const y0 = y - height / 2;
        const y1 = y + height / 2;
        const frame = { cast: false, receive: false, wall: side };
        if (axis === 'z') {
          box(roomRoot, mats.neonCyan, width + f, f, f, x, y1, z, frame);
          box(roomRoot, mats.neonCyan, width + f, f, f, x, y0, z, frame);
          box(roomRoot, mats.neonCyan, f, height, f, x - width / 2, y, z, frame);
          box(roomRoot, mats.neonCyan, f, height, f, x + width / 2, y, z, frame);
          const pane = new THREE.Mesh(new THREE.PlaneGeometry(width - 0.08, height - 0.08), mats.glass);
          pane.position.set(x, y, z);
          pane.castShadow = false;
          pane.receiveShadow = false;
          pane.userData.wall = side;
          roomRoot.add(pane);
          return;
        }
        box(roomRoot, mats.neonCyan, f, f, width + f, x, y1, z, frame);
        box(roomRoot, mats.neonCyan, f, f, width + f, x, y0, z, frame);
        box(roomRoot, mats.neonCyan, f, height, f, x, y, z - width / 2, frame);
        box(roomRoot, mats.neonCyan, f, height, f, x, y, z + width / 2, frame);
        const pane = new THREE.Mesh(new THREE.PlaneGeometry(width - 0.08, height - 0.08), mats.glass);
        pane.rotation.y = Math.PI / 2;
        pane.position.set(x, y, z);
        pane.castShadow = false;
        pane.receiveShadow = false;
        pane.userData.wall = side;
        roomRoot.add(pane);
      }

      function addWallAlongX(x0, x1, zCenter, holes, side) {
        const H = 2.4;
        const t = 0.16;
        const y0 = WIN_Y - WIN_H / 2;
        const y1 = WIN_Y + WIN_H / 2;
        const fullW = x1 - x0;
        const opt = { wall: side };
        box(roomRoot, mats.wall, fullW, y0, t, x0 + fullW / 2, y0 / 2, zCenter, opt);
        const topH = H - y1;
        box(roomRoot, mats.wall, fullW, topH, t, x0 + fullW / 2, y1 + topH / 2, zCenter, opt);
        const ordered = holes.slice().sort((a, b) => a.x0 - b.x0);
        let cursor = x0;
        ordered.forEach((hole) => {
          const span = hole.x0 - cursor;
          if (span > 0.02) box(roomRoot, mats.wall, span, WIN_H, t, cursor + span / 2, WIN_Y, zCenter, opt);
          cursor = hole.x1;
        });
        const end = x1 - cursor;
        if (end > 0.02) box(roomRoot, mats.wall, end, WIN_H, t, cursor + end / 2, WIN_Y, zCenter, opt);
      }

      function addWallAlongZ(z0, z1, xCenter, holes, side) {
        const H = 2.4;
        const t = 0.16;
        const y0 = WIN_Y - WIN_H / 2;
        const y1 = WIN_Y + WIN_H / 2;
        const fullD = z1 - z0;
        const opt = { wall: side };
        box(roomRoot, mats.wall, t, y0, fullD, xCenter, y0 / 2, z0 + fullD / 2, opt);
        const topH = H - y1;
        box(roomRoot, mats.wall, t, topH, fullD, xCenter, y1 + topH / 2, z0 + fullD / 2, opt);
        const ordered = holes.slice().sort((a, b) => a.z0 - b.z0);
        let cursor = z0;
        ordered.forEach((hole) => {
          const span = hole.z0 - cursor;
          if (span > 0.02) box(roomRoot, mats.wall, t, WIN_H, span, xCenter, WIN_Y, cursor + span / 2, opt);
          cursor = hole.z1;
        });
        const end = z1 - cursor;
        if (end > 0.02) box(roomRoot, mats.wall, t, WIN_H, end, xCenter, WIN_Y, cursor + end / 2, opt);
      }

      function makeSky(width, height) {
        const geo = new THREE.PlaneGeometry(width, height, 1, 8);
        const pos = geo.attributes.position;
        const colors = [];
        const top = new THREE.Color(0x3b1458);
        const bottom = new THREE.Color(0xd2479a);
        const mix = new THREE.Color();
        for (let i = 0; i < pos.count; i += 1) {
          const v = (pos.getY(i) + height / 2) / height;
          mix.copy(bottom).lerp(top, v * v);
          colors.push(mix.r, mix.g, mix.b);
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        const mesh = new THREE.Mesh(geo, mats.sky);
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        return mesh;
      }

      function addPlant(parent, x, z, kind, rng) {
        const plant = new THREE.Group();
        plant.position.set(x, 0.18, z);
        plant.userData.sway = rng() * Math.PI * 2;
        const h = 0.62 + rng() * 0.7;
        const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.05, h, 5), mats.stalk);
        stalk.position.y = h / 2;
        stalk.castShadow = false;
        plant.add(stalk);
        const leafMat = kind === 1 ? mats.leafDeep : mats.leaf;
        const budMat = kind === 0 ? mats.neonCyan : kind === 1 ? mats.neonMagenta : mats.neonAcid;
        for (let i = 0; i < 3; i += 1) {
          const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.03, 0.12), leafMat);
          leaf.position.y = h * (0.42 + i * 0.16);
          leaf.rotation.y = i * 1.15 + rng();
          leaf.rotation.z = (i % 2 ? 1 : -1) * (0.45 + rng() * 0.25);
          leaf.castShadow = false;
          plant.add(leaf);
        }
        const bud = new THREE.Mesh(new THREE.SphereGeometry(0.08 + rng() * 0.045, 7, 5), budMat);
        bud.position.y = h + 0.05;
        bud.castShadow = false;
        plant.add(bud);
        parent.add(plant);
      }

      function addPlot(parent, x, z, pw, pd, rim, rng) {
        box(parent, mats.soil, pw, 0.16, pd, x, 0.08, z, { cast: false, receive: false });
        box(parent, mats.moss, pw - 0.14, 0.05, pd - 0.14, x, 0.16, z, { cast: false, receive: false });
        const f = 0.05;
        box(parent, rim, pw + 0.05, f, f, x, 0.18, z - pd / 2, { cast: false, receive: false });
        box(parent, rim, pw + 0.05, f, f, x, 0.18, z + pd / 2, { cast: false, receive: false });
        box(parent, rim, f, f, pd, x - pw / 2, 0.18, z, { cast: false, receive: false });
        box(parent, rim, f, f, pd, x + pw / 2, 0.18, z, { cast: false, receive: false });
        const cols = Math.max(2, Math.round(pw / 0.72));
        const rows = Math.max(2, Math.round(pd / 0.72));
        for (let i = 0; i < cols; i += 1) {
          for (let j = 0; j < rows; j += 1) {
            const px = x - pw / 2 + (i + 0.5) * (pw / cols) + (rng() - 0.5) * 0.06;
            const pz = z - pd / 2 + (j + 0.5) * (pd / rows) + (rng() - 0.5) * 0.06;
            addPlant(parent, px, pz, (i + j + Math.floor(rng() * 2)) % 3, rng);
          }
        }
      }

      function addGarden(w, d, north, side) {
        const view = new THREE.Group();
        roomRoot.add(view);
        const rng = mulberry32((w * 17 + d * 53) >>> 0);

        const skyN = makeSky(w + 18, 8.6);
        skyN.position.set(w / 2, 3.7, d + 10.2);
        view.add(skyN);
        const skyW = makeSky(d + 8, 7.2);
        skyW.rotation.y = Math.PI / 2;
        skyW.position.set(-6.6, 3.2, d * 0.48);
        view.add(skyW);
        const skyE = makeSky(d + 8, 7.2);
        skyE.rotation.y = -Math.PI / 2;
        skyE.position.set(w + 6.6, 3.2, d * 0.48);
        view.add(skyE);

        const groundN = new THREE.Mesh(new THREE.PlaneGeometry(w + 8, 8.6), mats.soil);
        groundN.rotation.x = -Math.PI / 2;
        groundN.position.set(w / 2, -0.02, d + 4.7);
        groundN.receiveShadow = false;
        view.add(groundN);
        const groundW = new THREE.Mesh(new THREE.PlaneGeometry(5.6, d + 3.2), mats.soil);
        groundW.rotation.x = -Math.PI / 2;
        groundW.position.set(-3.15, -0.02, d * 0.48);
        groundW.receiveShadow = false;
        view.add(groundW);
        const groundE = new THREE.Mesh(new THREE.PlaneGeometry(5.6, d + 3.2), mats.soil);
        groundE.rotation.x = -Math.PI / 2;
        groundE.position.set(w + 3.15, -0.02, d * 0.48);
        groundE.receiveShadow = false;
        view.add(groundE);

        const rims = [mats.neonCyan, mats.neonMagenta, mats.neonAcid];
        north.forEach((hole, i) => {
          addPlot(view, hole.cx, d + 2.45, Math.min(hole.ww + 0.15, 2.9), 2.2, rims[i % 3], rng);
        });
        addPlot(view, -2.55, side.cz, 2.15, Math.min(side.wz + 0.1, 2.05), mats.neonMagenta, rng);
        addPlot(view, w + 2.55, side.cz, 2.15, Math.min(side.wz + 0.1, 2.05), mats.neonCyan, rng);

        const pool = new THREE.Mesh(new THREE.CircleGeometry(1.15, 28), mats.pool);
        pool.rotation.x = -Math.PI / 2;
        pool.scale.set(1.4, 1, 1);
        pool.position.set(Math.min(w - 0.4, w * 0.84), 0.04, d + 6.15);
        view.add(pool);

        for (let i = 0; i < 7; i += 1) {
          addPlant(view, 0.4 + ((w - 0.8) * i) / 6, d + 6.3 + rng() * 1.1, i % 3, rng);
        }
        for (let i = 0; i < 12; i += 1) {
          const sprite = new THREE.Sprite(rng() > 0.55 ? mats.glowMagenta : mats.glowCyan);
          sprite.position.set(-0.4 + rng() * (w + 0.8), 0.45 + rng() * 1.7, d + 1.6 + rng() * 6.2);
          sprite.scale.set(0.2, 0.2, 1);
          view.add(sprite);
        }

        const lamp = new THREE.PointLight(0xffb7de, 18, 26, 2);
        lamp.position.set(w / 2, 3.5, d + 1.1);
        view.add(lamp);
      }

      function buildArchitecture(w, d) {
        const H = 2.4;
        const t = 0.16;
        box(roomRoot, mats.voidFloor, 48, 0.3, 48, w / 2, -0.48, d / 2, { cast: false });
        box(roomRoot, mats.slab, w + 0.4, 0.16, d + 0.4, w / 2, -0.16, d / 2, { cast: false });

        const tileGeo = new THREE.BoxGeometry(0.9, 0.05, 0.9);
        for (let x = 0; x < w; x += 1) {
          for (let z = 0; z < d; z += 1) {
            const tile = new THREE.Mesh(tileGeo, ((x + z) & 1) ? mats.tileB : mats.tileA);
            tile.position.set(x + 0.5, -0.025, z + 0.5);
            tile.receiveShadow = true;
            tile.castShadow = false;
            roomRoot.add(tile);
          }
        }

        const pts = [];
        const yLine = 0.02;
        for (let x = 0; x <= w; x += 1) pts.push(x, yLine, 0, x, yLine, d);
        for (let z = 0; z <= d; z += 1) pts.push(0, yLine, z, w, yLine, z);
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.38,
        }));
        lines.userData.ownMaterial = true;
        roomRoot.add(lines);
        gridLines = lines;

        const north = northHoles(w);
        const side = sideHole(d);
        addWallAlongZ(0, d, -t / 2, [side], 'w');
        addWallAlongZ(0, d, w + t / 2, [side], 'e');
        addWallAlongX(-0.02, w + 0.02, d + t / 2, north, 'n');
        north.forEach((hole) => addWindow('z', hole.cx, WIN_Y, d - 0.02, hole.ww, WIN_H, 'n'));
        addWindow('x', 0.02, WIN_Y, side.cz, side.wz, WIN_H, 'w');
        addWindow('x', w - 0.02, WIN_Y, side.cz, side.wz, WIN_H, 'e');
        addPanels('z', 0.03, d, side, 'w');
        addPanels('z', w - 0.03, d, side, 'e');
        addGarden(w, d, north, side);

        box(roomRoot, mats.neonMagenta, 0.03, 0.055, d, 0.02, 0.04, d / 2, { cast: false, receive: false });
        box(roomRoot, mats.neonMagenta, 0.03, 0.055, d, w - 0.02, 0.04, d / 2, { cast: false, receive: false });
        box(roomRoot, mats.neonCyan, 0.05, 0.04, d, 0, H + 0.02, d / 2, { cast: false, receive: false, wall: 'w' });
        box(roomRoot, mats.neonCyan, 0.05, 0.04, d, w, H + 0.02, d / 2, { cast: false, receive: false, wall: 'e' });
        box(roomRoot, mats.neonCyan, w, 0.04, 0.05, w / 2, H + 0.02, d, { cast: false, receive: false, wall: 'n' });

        box(roomRoot, mats.metal, w, 0.07, 0.1, w / 2, 0.035, -0.02);
        box(roomRoot, mats.neonMagenta, w, 0.028, 0.04, w / 2, 0.08, 0.01, { cast: false, receive: false });

        [[-0.02, -0.02], [w + 0.02, -0.02], [-0.02, d + 0.02], [w + 0.02, d + 0.02]].forEach(([x, z]) => {
          box(roomRoot, mats.wall, 0.22, 2.55, 0.22, x, 1.2, z, { wall: 'post' });
          box(roomRoot, mats.neonCyan, 0.26, 0.05, 0.26, x, 2.5, z, { cast: false, receive: false, wall: 'post' });
          const cap = new THREE.Sprite(mats.glowCyan);
          cap.position.set(x, 2.52, z);
          cap.scale.set(0.32, 0.32, 1);
          cap.userData.wall = 'post';
          roomRoot.add(cap);
        });

        const tubeW = Math.max(1.2, w - 1.5);
        box(roomRoot, mats.neonCyan, tubeW, 0.05, 0.07, w / 2, 2.28, d / 2, { cast: false, receive: false });
        const drops = Math.max(2, Math.round(w / 3));
        for (let i = 0; i < drops; i += 1) {
          const sprite = new THREE.Sprite(mats.glowCyan);
          sprite.position.set(w / 2 + (i - (drops - 1) / 2) * 1.35, 2.26, d / 2);
          sprite.scale.set(0.62, 0.62, 1);
          roomRoot.add(sprite);
        }
        const roomLight = new THREE.PointLight(0xc4b0ff, 22, 16, 2);
        roomLight.position.set(w / 2, 2.05, d / 2);
        roomRoot.add(roomLight);

        box(roomRoot, mats.girder, 0.16, 3.3, 0.16, -1.65, 1.45, d * 0.32);
        box(roomRoot, mats.girder, 0.14, 2.5, 0.14, w + 1.45, 1.15, d * 0.66);
        box(roomRoot, mats.girder, Math.min(3.4, w * 0.46), 0.1, 0.1, w * 0.28, 2.65, d + 1.25);
        applyGrid();
        applyWalls();
      }
    }

    function makeMaterials(THREE) {
      const rugMap = makeRugTexture(THREE);
      const glowMap = makeGlowTexture(THREE);
      const soilMap = makeSoilTexture(THREE);
      const poolMap = makePoolTexture(THREE);
      const std = (p) => new THREE.MeshStandardMaterial({
        roughness: 0.58,
        metalness: 0.18,
        flatShading: true,
        ...p,
      });
      const neon = (hex) => new THREE.MeshStandardMaterial({
        color: 0x09060f,
        emissive: hex,
        emissiveIntensity: 1.3,
        roughness: 0.32,
        metalness: 0.08,
        flatShading: false,
      });
      const glow = (color, opacity) => new THREE.SpriteMaterial({
        map: glowMap,
        color,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity,
      });
      return {
        tileA: std({ color: 0x1a1026, roughness: 0.9, metalness: 0.1, flatShading: false }),
        tileB: std({ color: 0x27143a, roughness: 0.86, metalness: 0.14, emissive: 0x1a1028, emissiveIntensity: 0.35, flatShading: false }),
        slab: std({ color: 0x0c0714, roughness: 0.95, metalness: 0.16, flatShading: false }),
        voidFloor: std({ color: 0x05030a, roughness: 1, metalness: 0, flatShading: false }),
        wall: std({ color: 0x16101f, roughness: 0.8, metalness: 0.3, flatShading: false }),
        panel: std({ color: 0x241833, roughness: 0.68, metalness: 0.38, flatShading: false }),
        girder: std({ color: 0x2a1a38, roughness: 0.5, metalness: 0.62 }),
        metal: std({ color: 0x2c2440, roughness: 0.34, metalness: 0.76 }),
        frame: std({ color: 0x261838, roughness: 0.46, metalness: 0.52 }),
        headboard: std({ color: 0x3c2460, roughness: 0.5, metalness: 0.28 }),
        mattress: std({ color: 0x6c4c9c, roughness: 0.86, metalness: 0.02, flatShading: false }),
        pillow: std({ color: 0xf0c6e4, roughness: 0.78, metalness: 0, flatShading: false }),
        plush: std({ color: 0xb45cff, roughness: 0.72, metalness: 0.02 }),
        plushDeep: std({ color: 0x7428b0, roughness: 0.68, metalness: 0.02 }),
        belly: std({ color: 0xe6d4ff, roughness: 0.62, metalness: 0, flatShading: false }),
        eye: std({ color: 0x140814, roughness: 0.28, metalness: 0.45, emissive: 0x1a0a18, emissiveIntensity: 0.4 }),
        shade: std({
          color: 0x2a1028,
          emissive: 0xff1e8a,
          emissiveIntensity: 0.5,
          roughness: 0.4,
          metalness: 0.15,
          side: THREE.DoubleSide,
        }),
        bulb: std({
          color: 0xd9fdff,
          emissive: 0x00f0ff,
          emissiveIntensity: 1.7,
          roughness: 0.2,
          metalness: 0,
          flatShading: false,
        }),
        crate: std({ color: 0x4a3c68, roughness: 0.6, metalness: 0.24 }),
        crateEdge: std({ color: 0x8e7eac, roughness: 0.38, metalness: 0.58 }),
        shelf: std({ color: 0x1b1426, roughness: 0.48, metalness: 0.62 }),
        bookMag: std({ color: 0xff1e8a, roughness: 0.52, metalness: 0.08 }),
        bookCyan: std({ color: 0x147c8c, roughness: 0.48, metalness: 0.2, emissive: 0x00f0ff, emissiveIntensity: 0.18 }),
        bookAcid: std({ color: 0xb8ff00, roughness: 0.42, metalness: 0.05 }),
        can: std({ color: 0xd5d8ea, roughness: 0.32, metalness: 0.72 }),
        rug: std({ map: rugMap, color: 0xffffff, roughness: 0.96, metalness: 0, flatShading: false }),
        glass: new THREE.MeshStandardMaterial({
          color: 0x9eefff,
          emissive: 0x063038,
          emissiveIntensity: 0.08,
          metalness: 0.05,
          roughness: 0.04,
          transparent: true,
          opacity: 0.14,
          side: THREE.DoubleSide,
          depthWrite: false,
        }),
        soil: std({
          map: soilMap,
          color: 0xffffff,
          roughness: 0.96,
          metalness: 0,
          emissive: 0xffffff,
          emissiveMap: soilMap,
          emissiveIntensity: 0.28,
          flatShading: false,
        }),
        moss: std({
          color: 0x1d6a4e,
          emissive: 0x0e3a2c,
          emissiveIntensity: 0.45,
          roughness: 0.9,
          metalness: 0,
          flatShading: false,
        }),
        leaf: std({
          color: 0x3dba78,
          emissive: 0x14663c,
          emissiveIntensity: 0.55,
          roughness: 0.62,
          metalness: 0.02,
        }),
        leafDeep: std({
          color: 0x6e3058,
          emissive: 0x3a1430,
          emissiveIntensity: 0.35,
          roughness: 0.7,
          metalness: 0.02,
        }),
        stalk: std({ color: 0x3a2848, roughness: 0.7, metalness: 0.12 }),
        sky: new THREE.MeshBasicMaterial({
          vertexColors: true,
          fog: false,
          side: THREE.DoubleSide,
        }),
        pool: new THREE.MeshBasicMaterial({
          map: poolMap,
          transparent: true,
          depthWrite: false,
          fog: false,
        }),
        neonCyan: neon(0x00f0ff),
        neonMagenta: neon(0xff1e8a),
        neonAcid: neon(0xb8ff00),
        glowCyan: glow(0x00f0ff, 0.72),
        glowMagenta: glow(0xff1e8a, 0.5),
      };
    }

    function makeRugTexture(THREE) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#1a0b24';
      g.fillRect(0, 0, 256, 256);
      g.strokeStyle = '#ff1e8a';
      g.lineWidth = 16;
      g.strokeRect(12, 12, 232, 232);
      g.strokeStyle = '#00f0ff';
      g.lineWidth = 4;
      g.strokeRect(34, 34, 188, 188);
      g.beginPath();
      g.moveTo(128, 54);
      g.lineTo(202, 128);
      g.lineTo(128, 202);
      g.lineTo(54, 128);
      g.closePath();
      g.fillStyle = 'rgba(0, 240, 255, 0.08)';
      g.fill();
      g.strokeStyle = '#9d4edd';
      g.lineWidth = 6;
      g.stroke();
      g.fillStyle = '#00f0ff';
      g.fillRect(18, 18, 26, 26);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function makeGlowTexture(THREE) {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.28, 'rgba(255,255,255,0.6)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 64, 64);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeSoilTexture(THREE) {
      const size = 256;
      let seed = 4177;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#2b1f2a';
      g.fillRect(0, 0, size, size);
      for (let i = 0; i < 700; i += 1) {
        g.fillStyle = rnd() < 0.5 ? '#3a2a34' : '#161018';
        g.fillRect(rnd() * size, rnd() * size, 2, 2);
      }
      for (let i = 0; i < 7; i += 1) {
        const x = rnd() * size;
        const y = rnd() * size;
        const r = 26 + rnd() * 40;
        const grd = g.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, 'rgba(34,92,70,0.55)');
        grd.addColorStop(1, 'rgba(34,92,70,0)');
        g.fillStyle = grd;
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        g.fill();
      }
      for (let i = 0; i < 20; i += 1) {
        g.save();
        g.translate(rnd() * size, rnd() * size);
        g.rotate(rnd() * Math.PI);
        g.fillStyle = rnd() < 0.5 ? '#5a2648' : '#24504c';
        g.fillRect(-7, -2, 14, 4);
        g.restore();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function makePoolTexture(THREE) {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const g = c.getContext('2d');
      const mid = size / 2;
      const grd = g.createRadialGradient(mid, mid, 0, mid, mid, mid);
      grd.addColorStop(0, 'rgba(6,48,46,0.95)');
      grd.addColorStop(0.6, 'rgba(12,70,52,0.9)');
      grd.addColorStop(0.84, 'rgba(184,255,0,0.75)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
  </script>
