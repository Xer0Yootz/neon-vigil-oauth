<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#050208" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050208'/%3E%3Cpath d='M2 4h12v8H2z' fill='none' stroke='%2300f0ff' stroke-width='1'/%3E%3Cpath d='M2 8h12' stroke='%23ff1e8a' stroke-width='1'/%3E%3C/svg%3E" />
  <title>Room v2 — Infiniti 6</title>
  <style>
    :root {
      --bg-black: #050208;
      --panel-black: rgba(7, 3, 12, 0.92);
      --cyan: #00f0ff;
      --magenta: #ff1e8a;
      --amethyst: #9d4edd;
      --silver: #e2e8f0;
      --acid: #b8ff00;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-black);
      color: var(--silver);
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #view { position: fixed; inset: 0; z-index: 1; }
    #view canvas { display: block; touch-action: none; }

    #grade, #crt {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #grade {
      z-index: 2;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0) 48%, rgba(8, 2, 16, 0.55) 100%),
        linear-gradient(180deg, rgba(110, 40, 170, 0.08) 0%, rgba(255, 30, 138, 0.05) 100%);
    }
    #crt {
      z-index: 3;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.16) 0px,
        rgba(0, 0, 0, 0.16) 1px,
        rgba(0, 0, 0, 0) 1px,
        rgba(0, 0, 0, 0) 3px
      );
      mix-blend-mode: multiply;
      opacity: 0.4;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 0 1px rgba(0, 240, 255, 0.55);
    }

    .top-bar, .bottom-bar { pointer-events: auto; }

    .top-bar {
      background: var(--panel-black);
      border-bottom: 2px solid var(--magenta);
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }

    .brand { display: flex; flex-direction: column; gap: 1px; min-width: 96px; }
    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 1.4px;
      color: var(--cyan);
      text-transform: uppercase;
      font-weight: bold;
    }
    .sub {
      margin: 0;
      font-size: 11px;
      color: var(--magenta);
      letter-spacing: 1px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .tabs, .palette, .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-row {
      flex: 1 0 200px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }
    #status {
      margin: 0;
      font-size: 11px;
      color: var(--silver);
      text-align: right;
      line-height: 1.35;
    }

    .pill {
      flex: none;
      background: #10061c;
      border: 1px solid var(--acid);
      color: var(--acid);
      padding: 2px 7px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .pill.bad { border-color: var(--magenta); color: var(--magenta); }

    .bottom-bar {
      background: var(--panel-black);
      border-top: 2px solid var(--cyan);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hud-btn {
      pointer-events: auto;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #120722;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      box-shadow: 2px 2px 0 var(--magenta);
      padding: 7px 9px;
      min-height: 40px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hud-btn svg { display: block; flex: none; }
    .hud-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--magenta); }
    .hud-btn[aria-pressed="true"],
    .hud-btn[aria-selected="true"] {
      background: var(--magenta);
      color: #fff;
      border-color: var(--silver);
    }
    .hud-btn.is-dim { opacity: 0.42; }
    .hud-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .hint {
      margin: 0;
      font-size: 10px;
      line-height: 1.35;
      color: var(--silver);
      opacity: 0.78;
    }

    .radio-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    a.hud-btn { text-decoration: none; }
    .vol {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .vol input {
      width: 92px;
      accent-color: var(--cyan);
      touch-action: manipulation;
    }
    #radio-note { flex: 1 0 200px; margin: 0; }

    .boot {
      position: fixed;
      z-index: 6;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 12px 14px;
      background: var(--panel-black);
      border: 2px solid var(--cyan);
      box-shadow: 4px 4px 0 var(--magenta);
      color: var(--cyan);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      h1 { font-size: 14px; }
      .status-row { flex-basis: 100%; justify-content: space-between; }
      #status { text-align: left; }
      .hud-btn { padding: 8px 8px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #crt { opacity: 0.28; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="grade" aria-hidden="true"></div>
  <div id="crt" aria-hidden="true"></div>

  <div id="hud">
    <header class="top-bar">
      <div class="brand">
        <h1>Room v2</h1>
        <p class="sub">Infiniti 6</p>
      </div>
      <div class="tabs" role="tablist" aria-label="Rooms">
        <button type="button" class="hud-btn" role="tab" data-room="quarters-a">Quarters A</button>
        <button type="button" class="hud-btn" role="tab" data-room="quarters-b">Quarters B</button>
        <button type="button" class="hud-btn" role="tab" data-room="mess">Mess</button>
      </div>
      <div class="status-row">
        <p id="status" aria-live="polite">Loading room…</p>
        <span id="save-pill" class="pill">stored</span>
      </div>
    </header>

    <footer class="bottom-bar">
      <div class="palette" role="toolbar" aria-label="Pieces">
        <button type="button" class="hud-btn" data-tool="" title="Select (1)" aria-label="Select">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3l5 16 2.2-6.2L19 11z"/></svg>
          <span>Select</span>
        </button>
        <button type="button" class="hud-btn" data-tool="bed" title="Bed, 2 by 1 (2)" aria-label="Bed, covers 2 by 1 tiles">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 16V9h5l2 3h11v4"/><path d="M3 16h18v3H3z"/></svg>
          <span>Bed</span>
        </button>
        <button type="button" class="hud-btn" data-tool="plush" title="Stuffed, 1 by 1 (3)" aria-label="Stuffed animal, covers 1 tile">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="13" r="5"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="6" r="2"/></svg>
          <span>Stuffed</span>
        </button>
        <button type="button" class="hud-btn" data-tool="lamp" title="Lamp, 1 by 1 (4)" aria-label="Lamp, covers 1 tile">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 10h6l1 4H8z"/><path d="M12 14v5"/><path d="M9 20h6"/></svg>
          <span>Lamp</span>
        </button>
        <button type="button" class="hud-btn" data-tool="crate" title="Crate, 1 by 1 (5)" aria-label="Crate, covers 1 tile">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4"/><path d="M12 12v8"/></svg>
          <span>Crate</span>
        </button>
        <button type="button" class="hud-btn" data-tool="rug" title="Rug, 2 by 2 (6)" aria-label="Rug, covers 2 by 2 tiles">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="6" width="16" height="12"/><path d="M12 8l4 4-4 4-4-4z"/></svg>
          <span>Rug</span>
        </button>
        <button type="button" class="hud-btn" data-tool="shelf" title="Shelf, 2 by 1 (7)" aria-label="Shelf, covers 2 by 1 tiles">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4v16M18 4v16M6 8h12M6 13h12M6 18h12"/></svg>
          <span>Shelf</span>
        </button>
      </div>
      <div class="radio-row" role="group" aria-label="Radio">
        <button type="button" class="hud-btn" id="btn-sutro" aria-pressed="false" title="Play or stop the Sutro FM live feed">Sutro FM</button>
        <a class="hud-btn" href="https://sutrofm.net/" target="_blank" rel="noopener noreferrer" title="Open the Sutro FM site">Sutro site</a>
        <a class="hud-btn" href="https://somafm.com/groovesalad/" target="_blank" rel="noopener noreferrer" title="Open Soma FM Groove Salad">Groove Salad</a>
        <a class="hud-btn" href="https://somafm.com/dronezone/" target="_blank" rel="noopener noreferrer" title="Open Soma FM Drone Zone">Drone Zone</a>
        <a class="hud-btn" href="https://somafm.com/spacestation/" target="_blank" rel="noopener noreferrer" title="Open Soma FM Space Station Soma">Space Station</a>
        <label class="vol">Vol
          <input id="radio-vol" type="range" min="0" max="1" step="0.05" value="0.7" aria-label="Radio volume">
        </label>
        <p id="radio-note" class="hint"></p>
      </div>
      <div class="actions" role="toolbar" aria-label="Edit">
        <button type="button" class="hud-btn" id="btn-rotate" title="Rotate 90 degrees (R)">Rotate</button>
        <button type="button" class="hud-btn" id="btn-remove" title="Remove (Delete)">Remove</button>
        <button type="button" class="hud-btn" id="btn-reset" title="Restore the starter layout for this room">Reset</button>
        <button type="button" class="hud-btn" id="btn-save" title="Store the layout in this browser">Save</button>
      </div>
      <p id="hint" class="hint"></p>
    </footer>
  </div>

  <p id="boot-msg" class="boot">Loading room…</p>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    const STORAGE_KEY = 'nv.infiniti6.rooms.v1';
    const boot = document.getElementById('boot-msg');
    const statusEl = document.getElementById('status');
    const savePill = document.getElementById('save-pill');
    const hintEl = document.getElementById('hint');
    const btnRotate = document.getElementById('btn-rotate');
    const btnRemove = document.getElementById('btn-remove');
    const btnReset = document.getElementById('btn-reset');
    const btnSave = document.getElementById('btn-save');

    const coarse = window.matchMedia('(pointer: coarse)').matches;
    hintEl.textContent = coarse
      ? 'Tap a tile to place. Drag a piece to move it. Two fingers orbit and pinch. Double-tap a piece to turn it.'
      : 'Click a tile to place. Drag a piece to move it. Drag the open floor or right-drag to orbit, scroll to zoom. R rotates, Delete removes.';

    bootRadio();

    function bootRadio() {
      const RADIO_KEY = 'nv.infiniti6.radio.v1';
      const SUTRO_STREAM = 'https://media.evenings.co/s/7Lo66BLQe';
      const btn = document.getElementById('btn-sutro');
      const note = document.getElementById('radio-note');
      const vol = document.getElementById('radio-vol');
      const audio = new Audio();
      audio.preload = 'none';
      let on = false;

      function savedVolume() {
        try {
          const data = JSON.parse(localStorage.getItem(RADIO_KEY) || '{}');
          const value = Number(data.volume);
          if (Number.isFinite(value)) return Math.min(1, Math.max(0, value));
        } catch (err) { /* keep the default */ }
        return 0.7;
      }

      function say(text) { note.textContent = text; }

      function paint() {
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      }

      function stop() {
        on = false;
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        paint();
      }

      vol.value = String(savedVolume());
      audio.volume = Number(vol.value);
      vol.addEventListener('input', () => {
        audio.volume = Number(vol.value);
        try {
          localStorage.setItem(RADIO_KEY, JSON.stringify({ volume: audio.volume }));
        } catch (err) { /* storage off */ }
      });

      audio.addEventListener('error', () => {
        if (!on) return;
        stop();
        say('Sutro FM is off air.');
      });

      btn.addEventListener('click', () => {
        if (on) {
          stop();
          say('Sutro FM stopped.');
          return;
        }
        on = true;
        paint();
        say('Tuning Sutro FM…');
        audio.src = SUTRO_STREAM;
        audio.volume = Number(vol.value);
        audio.play().then(() => {
          if (on) say('Sutro FM is on.');
        }).catch((err) => {
          stop();
          say(err && err.name === 'NotAllowedError'
            ? 'Press Sutro FM again to start the audio.'
            : 'Sutro FM is off air.');
        });
      });

      say('Sutro FM plays here when that station is on air. Soma FM opens their player.');
    }

    try {
      const THREE = await import('three');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      start(THREE, OrbitControls);
    } catch (err) {
      console.error(err);
      boot.hidden = false;
      boot.textContent = 'Room view failed to start.';
    }

    function start(THREE, OrbitControls) {
      const motionOK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const ROOMS = {
        'quarters-a': { id: 'quarters-a', label: 'Quarters A', w: 8, d: 6 },
        'quarters-b': { id: 'quarters-b', label: 'Quarters B', w: 7, d: 7 },
        mess: { id: 'mess', label: 'Mess', w: 10, d: 7 },
      };
      const CATALOG = {
        bed: { w: 2, d: 1, label: 'Bed' },
        plush: { w: 1, d: 1, label: 'Stuffed' },
        lamp: { w: 1, d: 1, label: 'Lamp' },
        crate: { w: 1, d: 1, label: 'Crate' },
        rug: { w: 2, d: 2, label: 'Rug' },
        shelf: { w: 2, d: 1, label: 'Shelf' },
      };
      const STARTERS = {
        'quarters-a': [
          { type: 'rug', x: 1, z: 1, rot: 0 },
          { type: 'bed', x: 1, z: 1, rot: 0 },
          { type: 'plush', x: 2, z: 2, rot: 0 },
          { type: 'lamp', x: 6, z: 1, rot: 0 },
          { type: 'shelf', x: 4, z: 4, rot: 0 },
          { type: 'crate', x: 6, z: 4, rot: 0 },
        ],
        'quarters-b': [
          { type: 'rug', x: 2, z: 2, rot: 0 },
          { type: 'bed', x: 2, z: 3, rot: 0 },
          { type: 'plush', x: 3, z: 2, rot: 0 },
          { type: 'lamp', x: 6, z: 6, rot: 0 },
          { type: 'lamp', x: 4, z: 0, rot: 0 },
          { type: 'shelf', x: 0, z: 6, rot: 0 },
          { type: 'crate', x: 0, z: 0, rot: 0 },
          { type: 'crate', x: 5, z: 1, rot: 0 },
        ],
        mess: [
          { type: 'rug', x: 4, z: 2, rot: 0 },
          { type: 'plush', x: 5, z: 3, rot: 0 },
          { type: 'shelf', x: 1, z: 5, rot: 0 },
          { type: 'shelf', x: 6, z: 0, rot: 0 },
          { type: 'crate', x: 0, z: 1, rot: 0 },
          { type: 'crate', x: 1, z: 1, rot: 0 },
          { type: 'crate', x: 8, z: 3, rot: 0 },
          { type: 'crate', x: 8, z: 4, rot: 0 },
          { type: 'lamp', x: 0, z: 6, rot: 0 },
          { type: 'lamp', x: 9, z: 1, rot: 0 },
        ],
      };

      const BUILD = {
        bed: buildBed,
        plush: buildPlush,
        lamp: buildLamp,
        crate: buildCrate,
        rug: buildRug,
        shelf: buildShelf,
      };

      let seq = 1;
      function uid() {
        seq += 1;
        return 'p' + seq.toString(36) + Date.now().toString(36).slice(-3);
      }

      function room() { return ROOMS[state.active]; }
      function currentItems() { return state.rooms[state.active]; }
      function getItem(id) {
        if (!id) return null;
        return currentItems().find((it) => it.id === id) || null;
      }

      function footprint(type, rot) {
        const spec = CATALOG[type];
        if ((rot & 1) === 1) return { w: spec.d, d: spec.w };
        return { w: spec.w, d: spec.d };
      }

      function cellsOf(it) {
        const fp = footprint(it.type, it.rot);
        const out = [];
        for (let x = 0; x < fp.w; x += 1) {
          for (let z = 0; z < fp.d; z += 1) out.push([it.x + x, it.z + z]);
        }
        return out;
      }

      function fitsIn(roomDef, it, list) {
        const fp = footprint(it.type, it.rot);
        if (!Number.isFinite(it.x) || !Number.isFinite(it.z)) return false;
        if (it.x < 0 || it.z < 0 || it.x + fp.w > roomDef.w || it.z + fp.d > roomDef.d) return false;
        const mine = new Set(cellsOf(it).map(([x, z]) => x + ',' + z));
        for (const other of list) {
          if (other.id === it.id) continue;
          if ((other.type === 'rug') !== (it.type === 'rug')) continue;
          for (const [x, z] of cellsOf(other)) {
            if (mine.has(x + ',' + z)) return false;
          }
        }
        return true;
      }

      function assertStarters() {
        Object.keys(ROOMS).forEach((id) => {
          const list = [];
          STARTERS[id].forEach((raw, i) => {
            const it = { ...raw, id: 'starter-' + i };
            if (!fitsIn(ROOMS[id], it, list)) {
              throw new Error('Starter layout does not fit: ' + id);
            }
            list.push(it);
          });
        });
      }

      function cloneStarter(id) {
        return STARTERS[id].map((raw) => ({
          id: uid(),
          type: raw.type,
          x: raw.x,
          z: raw.z,
          rot: raw.rot,
        }));
      }

      function sanitize(roomDef, list) {
        const kept = [];
        const used = new Set();
        list.forEach((raw) => {
          if (!raw || !CATALOG[raw.type]) return;
          const rotN = Number(raw.rot);
          let id = typeof raw.id === 'string' && raw.id ? raw.id : '';
          if (!id || used.has(id)) id = uid();
          const it = {
            id,
            type: raw.type,
            x: Math.round(Number(raw.x)),
            z: Math.round(Number(raw.z)),
            rot: Number.isFinite(rotN) ? ((Math.round(rotN) % 4) + 4) % 4 : 0,
          };
          if (!fitsIn(roomDef, it, kept)) return;
          used.add(it.id);
          kept.push(it);
        });
        return kept;
      }

      function freshState() {
        return {
          active: 'quarters-a',
          rooms: Object.fromEntries(Object.keys(ROOMS).map((id) => [id, cloneStarter(id)])),
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return freshState();
          const data = JSON.parse(raw);
          if (!data || data.v !== 1 || !data.rooms) return freshState();
          const rooms = {};
          Object.keys(ROOMS).forEach((id) => {
            const list = Array.isArray(data.rooms[id]) ? data.rooms[id] : null;
            rooms[id] = list ? sanitize(ROOMS[id], list) : cloneStarter(id);
          });
          const active = ROOMS[data.active] ? data.active : 'quarters-a';
          return { active, rooms };
        } catch (err) {
          return freshState();
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            v: 1,
            active: state.active,
            rooms: state.rooms,
          }));
          savePill.textContent = 'stored';
          savePill.classList.remove('bad');
          return true;
        } catch (err) {
          savePill.textContent = 'not stored';
          savePill.classList.add('bad');
          return false;
        }
      }

      assertStarters();
      let state = loadState();
      let placeType = null;
      let placeRot = 0;
      let selectedId = null;
      let hoverTile = null;
      let hoverItem = null;
      let flash = '';
      let flashTimer = 0;
      let resetUntil = 0;
      let roomRoot = null;
      let ghost = null;
      const objects = new Map();
      const pointers = new Set();
      let multi = false;
      let gesture = null;
      let lastTap = 0;

      const mats = makeMaterials(THREE);

      const view = document.getElementById('view');
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.28;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setClearColor(0x07030c);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.domElement.setAttribute('aria-label', 'Room view');
      view.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x07030c);
      scene.fog = new THREE.Fog(0x07030c, 18, 42);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 80);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = motionOK;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.rotateSpeed = 0.75;
      controls.zoomSpeed = 0.85;
      controls.minPolarAngle = 0.18;
      controls.maxPolarAngle = Math.PI / 2 - 0.06;
      controls.mouseButtons.LEFT = -1;
      controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
      controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
      controls.touches.ONE = -1;
      controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;

      const hemi = new THREE.HemisphereLight(0xff6fb5, 0x06141a, 0.85);
      const ambient = new THREE.AmbientLight(0x2a1244, 0.62);
      const key = new THREE.DirectionalLight(0xd7fbff, 1.75);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.bias = -0.00035;
      key.shadow.normalBias = 0.045;
      const fill = new THREE.DirectionalLight(0xff1e8a, 0.95);
      scene.add(hemi, ambient, key, key.target, fill, fill.target);

      const marker = new THREE.Mesh(
        new THREE.BoxGeometry(1, 0.025, 1),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.35, depthWrite: false })
      );
      marker.visible = false;
      marker.renderOrder = 2;
      scene.add(marker);

      const selBox = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
        new THREE.LineBasicMaterial({ color: 0xff1e8a })
      );
      selBox.visible = false;
      scene.add(selBox);

      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      const floorHit = new THREE.Vector3();
      const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const box3 = new THREE.Box3();
      const boxSize = new THREE.Vector3();
      const boxCenter = new THREE.Vector3();
      const clock = new THREE.Clock();

      function setStatus(msg) {
        flash = msg || '';
        renderStatus();
        window.clearTimeout(flashTimer);
        if (flash) {
          flashTimer = window.setTimeout(() => {
            flash = '';
            renderStatus();
          }, 2200);
        }
      }

      function renderStatus() {
        const items = currentItems();
        const n = items.length;
        let text = room().label + ' · ' + room().w + '×' + room().d + ' · ' + n + (n === 1 ? ' piece' : ' pieces');
        if (placeType) text += ' · placing ' + CATALOG[placeType].label + ' ' + (placeRot * 90) + '°';
        else if (selectedId && getItem(selectedId)) {
          text += ' · ' + CATALOG[getItem(selectedId).type].label + ' selected';
        }
        if (flash) text += ' · ' + flash;
        statusEl.textContent = text;
        statusEl.dataset.room = state.active;
        statusEl.dataset.count = String(n);
        statusEl.dataset.tool = placeType || 'select';
      }

      function updateButtons() {
        document.querySelectorAll('[data-tool]').forEach((btn) => {
          const tool = btn.getAttribute('data-tool');
          const on = tool ? tool === placeType : !placeType;
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        document.querySelectorAll('[data-room]').forEach((btn) => {
          const on = btn.getAttribute('data-room') === state.active;
          btn.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        const canEdit = !placeType && !!getItem(selectedId);
        btnRotate.classList.toggle('is-dim', !canEdit && !placeType);
        btnRemove.classList.toggle('is-dim', !canEdit);
      }

      function paintCursor() {
        const el = renderer.domElement;
        if (gesture && gesture.dragging) el.style.cursor = 'grabbing';
        else if (placeType) el.style.cursor = 'crosshair';
        else if (hoverItem) el.style.cursor = 'pointer';
        else el.style.cursor = 'default';
      }

      function showMarker(it, color, opacity) {
        const fp = footprint(it.type, it.rot);
        marker.visible = true;
        marker.scale.set(fp.w * 0.98, 1, fp.d * 0.98);
        marker.position.set(it.x + fp.w / 2, 0.06, it.z + fp.d / 2);
        marker.material.color.setHex(color);
        marker.material.opacity = opacity;
      }

      function showSelBox(it) {
        const obj = objects.get(it.id);
        if (!obj) {
          selBox.visible = false;
          return;
        }
        box3.makeEmpty();
        obj.traverse((o) => {
          if (o.isMesh) box3.expandByObject(o);
        });
        if (box3.isEmpty()) {
          selBox.visible = false;
          return;
        }
        box3.getSize(boxSize);
        box3.getCenter(boxCenter);
        selBox.visible = true;
        selBox.position.copy(boxCenter);
        selBox.scale.set(boxSize.x + 0.08, boxSize.y + 0.08, boxSize.z + 0.08);
      }

      function updateMarker() {
        const dragging = gesture && gesture.dragging ? getItem(gesture.itemId) : null;
        if (placeType && hoverTile && !dragging) {
          const temp = { id: '__ghost', type: placeType, x: hoverTile.x, z: hoverTile.z, rot: placeRot };
          const ok = fitsIn(room(), temp, currentItems());
          if (ghost) {
            ghost.visible = true;
            positionGroup(ghost, temp);
          }
          showMarker(temp, ok ? 0x00f0ff : 0xff1e8a, ok ? 0.3 : 0.42);
          selBox.visible = false;
          paintCursor();
          return;
        }
        if (ghost) ghost.visible = false;
        const it = dragging || (!placeType ? getItem(selectedId) : null);
        if (!it) {
          marker.visible = false;
          selBox.visible = false;
          paintCursor();
          return;
        }
        const ok = fitsIn(room(), it, currentItems());
        showMarker(it, ok ? 0xff1e8a : 0xff4466, 0.4);
        showSelBox(it);
        paintCursor();
      }

      function positionGroup(group, it) {
        const fp = footprint(it.type, it.rot);
        group.position.set(it.x + fp.w / 2, 0, it.z + fp.d / 2);
        group.rotation.y = it.rot * (Math.PI / 2);
      }

      function disposeGroup(root) {
        const geos = new Set();
        const owned = new Set();
        root.traverse((o) => {
          if (o.geometry) geos.add(o.geometry);
          if (o.userData && o.userData.ownMaterial && o.material) {
            const list = Array.isArray(o.material) ? o.material : [o.material];
            list.forEach((m) => owned.add(m));
          }
        });
        geos.forEach((g) => g.dispose());
        owned.forEach((m) => m.dispose());
      }

      function addObject(it) {
        const group = BUILD[it.type](false);
        positionGroup(group, it);
        group.userData.id = it.id;
        roomRoot.add(group);
        objects.set(it.id, group);
      }

      function swapGhost(type) {
        if (ghost) {
          scene.remove(ghost);
          disposeGroup(ghost);
          ghost = null;
        }
        if (!type) return;
        ghost = BUILD[type](true);
        ghost.traverse((o) => {
          if (!o.isMesh) return;
          const m = o.material.clone();
          m.transparent = true;
          m.opacity = 0.42;
          m.depthWrite = false;
          o.material = m;
          o.userData.ownMaterial = true;
          o.castShadow = false;
          o.receiveShadow = false;
        });
        ghost.visible = false;
        ghost.renderOrder = 3;
        scene.add(ghost);
      }

      function aimLights() {
        const rm = room();
        const cx = rm.w / 2;
        const cz = rm.d / 2;
        key.position.set(cx - rm.w * 0.35, 9.5, cz - rm.d);
        key.target.position.set(cx, 0.4, cz);
        key.target.updateMatrixWorld();
        fill.position.set(cx + rm.w * 0.55, 3.6, cz + rm.d * 0.85);
        fill.target.position.set(cx, 0.8, cz);
        fill.target.updateMatrixWorld();
        const span = Math.max(rm.w, rm.d) + 2;
        const cam = key.shadow.camera;
        cam.left = -span;
        cam.right = span;
        cam.top = span;
        cam.bottom = -span;
        cam.near = 0.4;
        cam.far = 42;
        cam.updateProjectionMatrix();
      }

      function frameCamera() {
        const rm = room();
        const span = Math.max(rm.w, rm.d);
        controls.minDistance = span * 0.62;
        controls.maxDistance = span * 2.9;
        controls.target.set(rm.w / 2, 0.45, rm.d * 0.4);
        camera.position.set(rm.w / 2 + span * 0.08, span * 0.82, -span * 0.58);
        controls.update();
      }

      function rebuild() {
        if (roomRoot) {
          scene.remove(roomRoot);
          disposeGroup(roomRoot);
        }
        objects.clear();
        roomRoot = new THREE.Group();
        scene.add(roomRoot);
        buildArchitecture(room().w, room().d);
        currentItems().forEach(addObject);
        aimLights();
        updateMarker();
        updateButtons();
        renderStatus();
      }

      function tileFromClient(cx, cy) {
        const rect = renderer.domElement.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        ndc.x = ((cx - rect.left) / rect.width) * 2 - 1;
        ndc.y = -((cy - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
        if (!raycaster.ray.intersectPlane(floorPlane, floorHit)) return null;
        const x = Math.floor(floorHit.x + 1e-4);
        const z = Math.floor(floorHit.z + 1e-4);
        const rm = room();
        if (x < 0 || z < 0 || x >= rm.w || z >= rm.d) return null;
        return { x, z };
      }

      function primaryAt(x, z) {
        let rug = null;
        let solid = null;
        currentItems().forEach((it) => {
          cellsOf(it).forEach(([cx, cz]) => {
            if (cx !== x || cz !== z) return;
            if (it.type === 'rug') rug = it;
            else solid = it;
          });
        });
        return solid || rug;
      }

      function overHud(e) {
        const t = e.target;
        return !!(t && t.closest && t.closest('#hud'));
      }

      function clearSelection() {
        selectedId = null;
        updateMarker();
        updateButtons();
        renderStatus();
      }

      function findRotation(it) {
        const nextRot = (it.rot + 1) % 4;
        const fp = footprint(it.type, nextRot);
        const cur = footprint(it.type, it.rot);
        const old = new Set(cellsOf(it).map(([x, z]) => x + ',' + z));
        let best = null;
        let bestScore = -Infinity;
        for (let x = it.x - fp.w; x <= it.x + cur.w; x += 1) {
          for (let z = it.z - fp.d; z <= it.z + cur.d; z += 1) {
            const cand = { id: it.id, type: it.type, x, z, rot: nextRot };
            if (!fitsIn(room(), cand, currentItems())) continue;
            let overlap = 0;
            cellsOf(cand).forEach(([cx, cz]) => {
              if (old.has(cx + ',' + cz)) overlap += 1;
            });
            const score = overlap * 20 - Math.abs(x - it.x) - Math.abs(z - it.z);
            if (score > bestScore) {
              bestScore = score;
              best = cand;
            }
          }
        }
        return best;
      }

      function doRotate() {
        if (placeType) {
          placeRot = (placeRot + 1) % 4;
          updateMarker();
          renderStatus();
          setStatus('Stamp ' + (placeRot * 90) + '°');
          return;
        }
        const it = getItem(selectedId);
        if (!it) {
          setStatus('Select a piece to rotate');
          return;
        }
        const next = findRotation(it);
        if (!next) {
          setStatus('No room to turn');
          return;
        }
        it.x = next.x;
        it.z = next.z;
        it.rot = next.rot;
        positionGroup(objects.get(it.id), it);
        updateMarker();
        persist();
        setStatus('Turned 90°');
      }

      function doRemove() {
        const it = getItem(selectedId);
        if (!it || placeType) {
          setStatus('Select a piece to remove');
          return;
        }
        const obj = objects.get(it.id);
        state.rooms[state.active] = currentItems().filter((row) => row.id !== it.id);
        if (obj) {
          roomRoot.remove(obj);
          disposeGroup(obj);
          objects.delete(it.id);
        }
        selectedId = null;
        updateMarker();
        updateButtons();
        persist();
        renderStatus();
        setStatus('Removed');
      }

      function tryPlace(tile) {
        const it = { id: uid(), type: placeType, x: tile.x, z: tile.z, rot: placeRot };
        if (!fitsIn(room(), it, currentItems())) {
          setStatus('No room there');
          return;
        }
        currentItems().push(it);
        addObject(it);
        persist();
        renderStatus();
        setStatus('Placed ' + CATALOG[placeType].label);
      }

      function handleTap(e) {
        const tile = tileFromClient(e.clientX, e.clientY);
        if (!tile) {
          if (!placeType) clearSelection();
          return;
        }
        if (placeType) {
          tryPlace(tile);
          updateMarker();
          return;
        }
        const it = primaryAt(tile.x, tile.z);
        if (!it) {
          clearSelection();
          return;
        }
        const now = performance.now();
        if (it.id === selectedId && now - lastTap < 360) {
          lastTap = 0;
          doRotate();
          return;
        }
        selectedId = it.id;
        lastTap = now;
        updateMarker();
        updateButtons();
        renderStatus();
      }

      function dragTo(e) {
        const tile = tileFromClient(e.clientX, e.clientY);
        if (!tile || !gesture) return;
        const it = getItem(gesture.itemId);
        if (!it) return;
        const nx = tile.x + gesture.grab.dx;
        const nz = tile.z + gesture.grab.dz;
        if (nx === it.x && nz === it.z) return;
        it.x = nx;
        it.z = nz;
        positionGroup(objects.get(it.id), it);
        updateMarker();
      }

      function finishDrag() {
        const it = getItem(gesture.itemId);
        if (!it) return;
        if (!fitsIn(room(), it, currentItems())) {
          it.x = gesture.origin.x;
          it.z = gesture.origin.z;
          const obj = objects.get(it.id);
          if (obj) positionGroup(obj, it);
          setStatus('No room there');
        } else if (it.x !== gesture.origin.x || it.z !== gesture.origin.z) {
          persist();
          setStatus('Moved');
        }
        updateMarker();
        renderStatus();
      }

      function cancelDrag() {
        if (gesture && gesture.dragging) {
          const it = getItem(gesture.itemId);
          if (it && gesture.origin) {
            it.x = gesture.origin.x;
            it.z = gesture.origin.z;
            const obj = objects.get(it.id);
            if (obj) positionGroup(obj, it);
          }
        }
        gesture = null;
        controls.enabled = true;
        updateMarker();
      }

      function onPointerDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        pointers.add(e.pointerId);
        if (pointers.size > 1) {
          multi = true;
          cancelDrag();
          controls.mouseButtons.LEFT = -1;
          return;
        }
        const tile = tileFromClient(e.clientX, e.clientY);
        const hit = !placeType && tile ? primaryAt(tile.x, tile.z) : null;
        const orbit = e.pointerType === 'mouse' && !placeType && !hit;
        controls.mouseButtons.LEFT = orbit ? THREE.MOUSE.ROTATE : -1;
        gesture = {
          id: e.pointerId,
          x: e.clientX,
          y: e.clientY,
          moved: false,
          dragging: false,
          itemId: hit ? hit.id : null,
          origin: hit ? { x: hit.x, z: hit.z } : null,
          grab: hit && tile ? { dx: hit.x - tile.x, dz: hit.z - tile.z } : { dx: 0, dz: 0 },
        };
      }

      function onPointerMove(e) {
        if (gesture && e.pointerId === gesture.id && !multi) {
          const dist = Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y);
          if (dist > 8) gesture.moved = true;
          if (gesture.itemId && gesture.moved) {
            if (!gesture.dragging) {
              gesture.dragging = true;
              selectedId = gesture.itemId;
              controls.enabled = false;
              updateButtons();
              renderStatus();
            }
            dragTo(e);
            paintCursor();
            return;
          }
        }
        if (!gesture || !gesture.dragging) {
          if (overHud(e)) {
            hoverTile = null;
            hoverItem = null;
          } else {
            hoverTile = tileFromClient(e.clientX, e.clientY);
            hoverItem = !placeType && hoverTile ? primaryAt(hoverTile.x, hoverTile.z) : null;
          }
          updateMarker();
        }
      }

      function onPointerUp(e) {
        pointers.delete(e.pointerId);
        const g = gesture;
        const cancel = e.type === 'pointercancel';
        if (g && g.id === e.pointerId) {
          if (cancel && g.dragging) {
            const it = getItem(g.itemId);
            if (it && g.origin) {
              it.x = g.origin.x;
              it.z = g.origin.z;
              const obj = objects.get(it.id);
              if (obj) positionGroup(obj, it);
            }
          } else if (!cancel && !multi && !g.moved) handleTap(e);
          else if (!cancel && g.dragging) finishDrag();
          gesture = null;
          controls.enabled = true;
        }
        if (pointers.size === 0) multi = false;
        if (!cancel) onPointerMove(e);
      }

      function setTool(type) {
        placeType = type;
        placeRot = 0;
        if (type) selectedId = null;
        swapGhost(type);
        updateMarker();
        updateButtons();
        renderStatus();
      }

      function switchRoom(id) {
        if (!ROOMS[id] || id === state.active) return;
        cancelDrag();
        state.active = id;
        selectedId = null;
        resetUntil = 0;
        btnReset.textContent = 'Reset';
        rebuild();
        frameCamera();
        persist();
        setStatus(ROOMS[id].label);
      }

      function onReset() {
        const now = performance.now();
        if (now > resetUntil) {
          resetUntil = now + 2400;
          btnReset.textContent = 'Confirm';
          setStatus('Confirm restores this room');
          window.setTimeout(() => {
            if (performance.now() >= resetUntil) btnReset.textContent = 'Reset';
          }, 2500);
          return;
        }
        resetUntil = 0;
        btnReset.textContent = 'Reset';
        cancelDrag();
        state.rooms[state.active] = cloneStarter(state.active);
        selectedId = null;
        rebuild();
        persist();
        setStatus('Room restored');
      }

      document.querySelectorAll('[data-room]').forEach((btn) => {
        btn.addEventListener('click', () => switchRoom(btn.getAttribute('data-room')));
      });
      document.querySelectorAll('[data-tool]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const tool = btn.getAttribute('data-tool');
          setTool(tool || null);
        });
      });
      btnRotate.addEventListener('click', doRotate);
      btnRemove.addEventListener('click', doRemove);
      btnReset.addEventListener('click', onReset);
      btnSave.addEventListener('click', () => {
        const ok = persist();
        setStatus(ok ? 'Layout stored in this browser' : 'Could not store the layout');
      });

      window.addEventListener('keydown', (e) => {
        const tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        const key = e.key.toLowerCase();
        if (key === 'escape') {
          setTool(null);
          clearSelection();
          return;
        }
        if (key === 'r') {
          e.preventDefault();
          doRotate();
          return;
        }
        if (key === 'delete' || key === 'backspace') {
          e.preventDefault();
          doRemove();
          return;
        }
        const tools = { 1: '', 2: 'bed', 3: 'plush', 4: 'lamp', 5: 'crate', 6: 'rug', 7: 'shelf' };
        if (Object.prototype.hasOwnProperty.call(tools, e.key)) setTool(tools[e.key] || null);
      });

      renderer.domElement.addEventListener('pointerdown', onPointerDown, true);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
      renderer.domElement.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        boot.hidden = false;
        boot.textContent = 'The room view stopped. Reload the page.';
      });

      function resize() {
        const w = window.innerWidth;
        const h = Math.max(1, window.innerHeight);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', resize);
      resize();

      function animate() {
        if (motionOK) {
          const s = 0.5 + 0.5 * Math.sin(clock.getElapsedTime() * 2.1);
          mats.neonCyan.emissiveIntensity = 1.15 + s * 0.5;
          mats.neonMagenta.emissiveIntensity = 1.05 + (1 - s) * 0.45;
          mats.bulb.emissiveIntensity = 1.45 + s * 0.9;
          mats.glowCyan.opacity = 0.42 + s * 0.38;
          mats.glowMagenta.opacity = 0.32 + (1 - s) * 0.28;
        }
        controls.update();
        renderer.render(scene, camera);
      }

      rebuild();
      frameCamera();
      persist();
      renderer.setAnimationLoop(animate);
      renderer.render(scene, camera);
      boot.hidden = true;
      window.__roomsReady = true;

      function box(parent, mat, sx, sy, sz, x, y, z, opts = {}) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = opts.cast !== false;
        mesh.receiveShadow = opts.receive !== false;
        parent.add(mesh);
        return mesh;
      }

      function shadeMesh(mesh) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function buildBed() {
        const g = new THREE.Group();
        const leg = new THREE.BoxGeometry(0.08, 0.12, 0.08);
        [[-0.86, -0.36], [0.86, -0.36], [-0.86, 0.36], [0.86, 0.36]].forEach(([x, z]) => {
          const m = shadeMesh(new THREE.Mesh(leg, mats.metal));
          m.position.set(x, 0.06, z);
          g.add(m);
        });
        box(g, mats.frame, 1.88, 0.14, 0.84, 0, 0.18, 0);
        box(g, mats.mattress, 1.72, 0.16, 0.7, 0.04, 0.32, 0);
        box(g, mats.pillow, 0.42, 0.12, 0.5, -0.58, 0.44, 0);
        box(g, mats.headboard, 0.1, 0.48, 0.78, -0.9, 0.42, 0);
        box(g, mats.neonMagenta, 0.035, 0.3, 0.035, -0.96, 0.46, 0, { cast: false, receive: false });
        box(g, mats.neonMagenta, 1.9, 0.025, 0.03, 0, 0.26, 0.42, { cast: false, receive: false });
        box(g, mats.neonCyan, 1.9, 0.02, 0.025, 0, 0.26, -0.42, { cast: false, receive: false });
        return g;
      }

      function buildPlush() {
        const g = new THREE.Group();
        const body = shadeMesh(new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), mats.plush));
        body.position.set(0, 0.28, 0);
        body.scale.set(1.05, 0.9, 0.88);
        g.add(body);
        const head = shadeMesh(new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), mats.plush));
        head.position.set(0, 0.52, -0.02);
        g.add(head);
        const earGeo = new THREE.SphereGeometry(0.055, 6, 5);
        [-0.09, 0.09].forEach((x) => {
          const ear = shadeMesh(new THREE.Mesh(earGeo, mats.plushDeep));
          ear.position.set(x, 0.66, -0.01);
          g.add(ear);
        });
        const limb = new THREE.SphereGeometry(0.065, 6, 5);
        [[-0.16, 0.06], [0.16, 0.06], [-0.1, 0.14], [0.1, 0.14]].forEach(([x, z]) => {
          const m = shadeMesh(new THREE.Mesh(limb, mats.plushDeep));
          m.position.set(x, 0.09, z);
          m.scale.set(1, 0.65, 0.8);
          g.add(m);
        });
        const belly = shadeMesh(new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), mats.belly));
        belly.position.set(0, 0.26, -0.14);
        belly.scale.set(1, 0.82, 0.42);
        g.add(belly);
        box(g, mats.neonCyan, 0.012, 0.12, 0.012, 0, 0.27, -0.2, { cast: false, receive: false });
        box(g, mats.neonCyan, 0.08, 0.012, 0.012, 0, 0.27, -0.2, { cast: false, receive: false });
        const eyeGeo = new THREE.SphereGeometry(0.026, 6, 4);
        [-0.05, 0.05].forEach((x) => {
          const eye = shadeMesh(new THREE.Mesh(eyeGeo, mats.eye));
          eye.position.set(x, 0.54, -0.14);
          g.add(eye);
          const glint = new THREE.Mesh(new THREE.SphereGeometry(0.009, 4, 3), mats.neonCyan);
          glint.position.set(x + 0.01, 0.552, -0.16);
          g.add(glint);
        });
        return g;
      }

      function buildLamp(ghost) {
        const g = new THREE.Group();
        const base = shadeMesh(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.06, 6), mats.metal));
        base.position.y = 0.03;
        g.add(base);
        const pole = shadeMesh(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.62, 6), mats.metal));
        pole.position.y = 0.36;
        g.add(pole);
        const shade = shadeMesh(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.26, 0.22, 6, 1, true), mats.shade));
        shade.position.y = 0.74;
        g.add(shade);
        const cap = shadeMesh(new THREE.Mesh(new THREE.CircleGeometry(0.15, 6), mats.metal));
        cap.rotation.x = -Math.PI / 2;
        cap.position.y = 0.85;
        g.add(cap);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 5), mats.bulb);
        bulb.position.y = 0.7;
        bulb.castShadow = false;
        g.add(bulb);
        if (!ghost) {
          const light = new THREE.PointLight(0x9af6ff, 9, 3.4, 2);
          light.position.y = 0.7;
          g.add(light);
          const glow = new THREE.Sprite(mats.glowCyan);
          glow.position.y = 0.72;
          glow.scale.set(0.55, 0.55, 1);
          g.add(glow);
        }
        return g;
      }

      function buildCrate() {
        const g = new THREE.Group();
        box(g, mats.crate, 0.72, 0.56, 0.72, 0, 0.34, 0);
        box(g, mats.crateEdge, 0.78, 0.06, 0.78, 0, 0.64, 0);
        box(g, mats.crateEdge, 0.78, 0.05, 0.78, 0, 0.08, 0);
        box(g, mats.neonCyan, 0.74, 0.055, 0.02, 0, 0.36, -0.37, { cast: false, receive: false });
        box(g, mats.neonMagenta, 0.02, 0.055, 0.74, 0.37, 0.36, 0, { cast: false, receive: false });
        return g;
      }

      function buildRug() {
        const g = new THREE.Group();
        const pad = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.028, 1.9), mats.rug);
        pad.position.y = 0.02;
        pad.castShadow = false;
        pad.receiveShadow = true;
        g.add(pad);
        box(g, mats.neonCyan, 0.16, 0.012, 0.16, -0.78, 0.04, -0.78, { cast: false, receive: false });
        return g;
      }

      function buildShelf() {
        const g = new THREE.Group();
        const upright = new THREE.BoxGeometry(0.08, 1.26, 0.58);
        [-0.9, 0.9].forEach((x) => {
          const u = shadeMesh(new THREE.Mesh(upright, mats.shelf));
          u.position.set(x, 0.63, 0);
          g.add(u);
        });
        const board = new THREE.BoxGeometry(1.82, 0.05, 0.58);
        [0.08, 0.5, 0.92].forEach((y) => {
          const b = shadeMesh(new THREE.Mesh(board, mats.shelf));
          b.position.set(0, y, 0);
          g.add(b);
        });
        box(g, mats.bookMag, 0.2, 0.28, 0.36, -0.5, 0.25, 0);
        box(g, mats.bookCyan, 0.14, 0.32, 0.36, -0.22, 0.27, 0);
        const can = shadeMesh(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.2, 6), mats.can));
        can.position.set(0.16, 0.2, 0);
        g.add(can);
        const orb = shadeMesh(new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), mats.neonMagenta));
        orb.position.set(0.48, 0.17, 0);
        g.add(orb);
        box(g, mats.bookAcid, 0.34, 0.07, 0.26, -0.18, 0.58, 0);
        const vial = shadeMesh(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.18, 5), mats.neonCyan));
        vial.position.set(0.32, 0.64, 0);
        g.add(vial);
        return g;
      }

      function addPanels(along, fixed, length) {
        const n = Math.max(2, Math.round(length / 1.8));
        const gap = 0.12;
        const span = length - gap * (n + 1);
        const pw = span / n;
        for (let i = 0; i < n; i += 1) {
          const offset = gap + pw / 2 + i * (pw + gap);
          if (along === 'z') {
            box(roomRoot, mats.panel, 0.035, 1.55, pw * 0.9, fixed, 1.28, offset, { cast: false });
          } else {
            box(roomRoot, mats.panel, pw * 0.9, 1.55, 0.035, offset, 1.28, fixed, { cast: false });
          }
        }
      }

      function addNorthWall(w, d) {
        const H = 2.4;
        const t = 0.16;
        const z = d + t / 2;
        const ww = Math.min(2.6, w * 0.42);
        const wh = 1.15;
        const cx = w / 2;
        const cy = 1.32;
        const x0 = -0.02;
        const x1 = w + 0.02;
        const fullW = x1 - x0;
        const y0 = cy - wh / 2;
        const y1 = cy + wh / 2;
        const wx0 = cx - ww / 2;
        const wx1 = cx + ww / 2;
        box(roomRoot, mats.wall, fullW, y0, t, x0 + fullW / 2, y0 / 2, z);
        const topH = H - y1;
        box(roomRoot, mats.wall, fullW, topH, t, x0 + fullW / 2, y1 + topH / 2, z);
        const leftW = wx0 - x0;
        box(roomRoot, mats.wall, leftW, wh, t, x0 + leftW / 2, cy, z);
        const rightW = x1 - wx1;
        box(roomRoot, mats.wall, rightW, wh, t, wx1 + rightW / 2, cy, z);
        const pane = new THREE.Mesh(new THREE.PlaneGeometry(ww - 0.04, wh - 0.04), mats.glass);
        pane.position.set(cx, cy, d - 0.01);
        roomRoot.add(pane);
        const f = 0.045;
        box(roomRoot, mats.neonCyan, ww + f, f, f, cx, y1, d - 0.02, { cast: false, receive: false });
        box(roomRoot, mats.neonCyan, ww + f, f, f, cx, y0, d - 0.02, { cast: false, receive: false });
        box(roomRoot, mats.neonCyan, f, wh, f, wx0, cy, d - 0.02, { cast: false, receive: false });
        box(roomRoot, mats.neonCyan, f, wh, f, wx1, cy, d - 0.02, { cast: false, receive: false });
        const rng = mulberry32(0x1f6);
        for (let i = 0; i < 14; i += 1) {
          const dot = new THREE.Mesh(
            new THREE.SphereGeometry(0.02 + rng() * 0.018, 4, 3),
            rng() > 0.72 ? mats.neonMagenta : mats.neonCyan
          );
          dot.position.set(
            cx + (rng() - 0.5) * ww * 0.82,
            cy + (rng() - 0.5) * wh * 0.72,
            d + 0.5 + rng() * 2.2
          );
          dot.castShadow = false;
          roomRoot.add(dot);
        }
        const glow = new THREE.Sprite(mats.glowCyan);
        glow.position.set(cx, cy, d + 0.15);
        glow.scale.set(ww * 0.55, wh * 0.45, 1);
        roomRoot.add(glow);
      }

      function buildArchitecture(w, d) {
        const H = 2.4;
        const t = 0.16;
        box(roomRoot, mats.voidFloor, 48, 0.3, 48, w / 2, -0.48, d / 2, { cast: false });
        box(roomRoot, mats.slab, w + 0.4, 0.16, d + 0.4, w / 2, -0.16, d / 2, { cast: false });

        const tileGeo = new THREE.BoxGeometry(0.9, 0.05, 0.9);
        for (let x = 0; x < w; x += 1) {
          for (let z = 0; z < d; z += 1) {
            const tile = new THREE.Mesh(tileGeo, ((x + z) & 1) ? mats.tileB : mats.tileA);
            tile.position.set(x + 0.5, -0.025, z + 0.5);
            tile.receiveShadow = true;
            tile.castShadow = false;
            roomRoot.add(tile);
          }
        }

        const pts = [];
        const yLine = 0.02;
        for (let x = 0; x <= w; x += 1) pts.push(x, yLine, 0, x, yLine, d);
        for (let z = 0; z <= d; z += 1) pts.push(0, yLine, z, w, yLine, z);
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.38,
        }));
        lines.userData.ownMaterial = true;
        roomRoot.add(lines);

        box(roomRoot, mats.wall, t, H, d, -t / 2, H / 2, d / 2);
        box(roomRoot, mats.wall, t, H, d, w + t / 2, H / 2, d / 2);
        addNorthWall(w, d);
        addPanels('z', 0.03, d);
        addPanels('z', w - 0.03, d);

        box(roomRoot, mats.neonMagenta, 0.03, 0.055, d, 0.02, 0.04, d / 2, { cast: false, receive: false });
        box(roomRoot, mats.neonMagenta, 0.03, 0.055, d, w - 0.02, 0.04, d / 2, { cast: false, receive: false });
        box(roomRoot, mats.neonCyan, 0.05, 0.04, d, 0, H + 0.02, d / 2, { cast: false, receive: false });
        box(roomRoot, mats.neonCyan, 0.05, 0.04, d, w, H + 0.02, d / 2, { cast: false, receive: false });
        box(roomRoot, mats.neonCyan, w, 0.04, 0.05, w / 2, H + 0.02, d, { cast: false, receive: false });

        box(roomRoot, mats.metal, w, 0.07, 0.1, w / 2, 0.035, -0.02);
        box(roomRoot, mats.neonMagenta, w, 0.028, 0.04, w / 2, 0.08, 0.01, { cast: false, receive: false });

        [[-0.02, -0.02], [w + 0.02, -0.02], [-0.02, d + 0.02], [w + 0.02, d + 0.02]].forEach(([x, z]) => {
          box(roomRoot, mats.wall, 0.22, 2.55, 0.22, x, 1.2, z);
          box(roomRoot, mats.neonCyan, 0.26, 0.05, 0.26, x, 2.5, z, { cast: false, receive: false });
          const cap = new THREE.Sprite(mats.glowCyan);
          cap.position.set(x, 2.52, z);
          cap.scale.set(0.32, 0.32, 1);
          roomRoot.add(cap);
        });

        const tubeW = Math.max(1.2, w - 1.5);
        box(roomRoot, mats.neonCyan, tubeW, 0.05, 0.07, w / 2, 2.28, d / 2, { cast: false, receive: false });
        const drops = Math.max(2, Math.round(w / 3));
        for (let i = 0; i < drops; i += 1) {
          const sprite = new THREE.Sprite(mats.glowCyan);
          sprite.position.set(w / 2 + (i - (drops - 1) / 2) * 1.35, 2.26, d / 2);
          sprite.scale.set(0.62, 0.62, 1);
          roomRoot.add(sprite);
        }
        const roomLight = new THREE.PointLight(0xc4b0ff, 22, 16, 2);
        roomLight.position.set(w / 2, 2.05, d / 2);
        roomRoot.add(roomLight);

        box(roomRoot, mats.girder, 0.16, 3.3, 0.16, -1.65, 1.45, d * 0.32);
        box(roomRoot, mats.girder, 0.14, 2.5, 0.14, w + 1.45, 1.15, d * 0.66);
        box(roomRoot, mats.girder, Math.min(3.4, w * 0.46), 0.1, 0.1, w * 0.28, 2.65, d + 1.25);
      }
    }

    function makeMaterials(THREE) {
      const rugMap = makeRugTexture(THREE);
      const glowMap = makeGlowTexture(THREE);
      const std = (p) => new THREE.MeshStandardMaterial({
        roughness: 0.58,
        metalness: 0.18,
        flatShading: true,
        ...p,
      });
      const neon = (hex) => new THREE.MeshStandardMaterial({
        color: 0x09060f,
        emissive: hex,
        emissiveIntensity: 1.3,
        roughness: 0.32,
        metalness: 0.08,
        flatShading: false,
      });
      const glow = (color, opacity) => new THREE.SpriteMaterial({
        map: glowMap,
        color,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity,
      });
      return {
        tileA: std({ color: 0x1a1026, roughness: 0.9, metalness: 0.1, flatShading: false }),
        tileB: std({ color: 0x27143a, roughness: 0.86, metalness: 0.14, emissive: 0x1a1028, emissiveIntensity: 0.35, flatShading: false }),
        slab: std({ color: 0x0c0714, roughness: 0.95, metalness: 0.16, flatShading: false }),
        voidFloor: std({ color: 0x05030a, roughness: 1, metalness: 0, flatShading: false }),
        wall: std({ color: 0x16101f, roughness: 0.8, metalness: 0.3, flatShading: false }),
        panel: std({ color: 0x241833, roughness: 0.68, metalness: 0.38, flatShading: false }),
        girder: std({ color: 0x2a1a38, roughness: 0.5, metalness: 0.62 }),
        metal: std({ color: 0x2c2440, roughness: 0.34, metalness: 0.76 }),
        frame: std({ color: 0x261838, roughness: 0.46, metalness: 0.52 }),
        headboard: std({ color: 0x3c2460, roughness: 0.5, metalness: 0.28 }),
        mattress: std({ color: 0x6c4c9c, roughness: 0.86, metalness: 0.02, flatShading: false }),
        pillow: std({ color: 0xf0c6e4, roughness: 0.78, metalness: 0, flatShading: false }),
        plush: std({ color: 0xb45cff, roughness: 0.72, metalness: 0.02 }),
        plushDeep: std({ color: 0x7428b0, roughness: 0.68, metalness: 0.02 }),
        belly: std({ color: 0xe6d4ff, roughness: 0.62, metalness: 0, flatShading: false }),
        eye: std({ color: 0x140814, roughness: 0.28, metalness: 0.45, emissive: 0x1a0a18, emissiveIntensity: 0.4 }),
        shade: std({
          color: 0x2a1028,
          emissive: 0xff1e8a,
          emissiveIntensity: 0.5,
          roughness: 0.4,
          metalness: 0.15,
          side: THREE.DoubleSide,
        }),
        bulb: std({
          color: 0xd9fdff,
          emissive: 0x00f0ff,
          emissiveIntensity: 1.7,
          roughness: 0.2,
          metalness: 0,
          flatShading: false,
        }),
        crate: std({ color: 0x4a3c68, roughness: 0.6, metalness: 0.24 }),
        crateEdge: std({ color: 0x8e7eac, roughness: 0.38, metalness: 0.58 }),
        shelf: std({ color: 0x1b1426, roughness: 0.48, metalness: 0.62 }),
        bookMag: std({ color: 0xff1e8a, roughness: 0.52, metalness: 0.08 }),
        bookCyan: std({ color: 0x147c8c, roughness: 0.48, metalness: 0.2, emissive: 0x00f0ff, emissiveIntensity: 0.18 }),
        bookAcid: std({ color: 0xb8ff00, roughness: 0.42, metalness: 0.05 }),
        can: std({ color: 0xd5d8ea, roughness: 0.32, metalness: 0.72 }),
        rug: std({ map: rugMap, color: 0xffffff, roughness: 0.96, metalness: 0, flatShading: false }),
        glass: new THREE.MeshStandardMaterial({
          color: 0x07141c,
          emissive: 0x00d0e0,
          emissiveIntensity: 0.22,
          metalness: 0.72,
          roughness: 0.08,
          transparent: true,
          opacity: 0.34,
          side: THREE.DoubleSide,
          depthWrite: false,
        }),
        neonCyan: neon(0x00f0ff),
        neonMagenta: neon(0xff1e8a),
        glowCyan: glow(0x00f0ff, 0.72),
        glowMagenta: glow(0xff1e8a, 0.5),
      };
    }

    function makeRugTexture(THREE) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#1a0b24';
      g.fillRect(0, 0, 256, 256);
      g.strokeStyle = '#ff1e8a';
      g.lineWidth = 16;
      g.strokeRect(12, 12, 232, 232);
      g.strokeStyle = '#00f0ff';
      g.lineWidth = 4;
      g.strokeRect(34, 34, 188, 188);
      g.beginPath();
      g.moveTo(128, 54);
      g.lineTo(202, 128);
      g.lineTo(128, 202);
      g.lineTo(54, 128);
      g.closePath();
      g.fillStyle = 'rgba(0, 240, 255, 0.08)';
      g.fill();
      g.strokeStyle = '#9d4edd';
      g.lineWidth = 6;
      g.stroke();
      g.fillStyle = '#00f0ff';
      g.fillRect(18, 18, 26, 26);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function makeGlowTexture(THREE) {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.28, 'rgba(255,255,255,0.6)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 64, 64);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
  </script>
