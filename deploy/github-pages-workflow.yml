# TO ENABLE: move this file to .github/workflows/pages.yml (needs a token or UI edit with the `workflow` scope),
# then set Settings > Pages > Source to "GitHub Actions". Until then Pages is served from the gh-pages branch
# built by deploy/build-pages.sh.
# Builds the web app (sign-in, hub, chat) plus the gated Gigas Garden page and deploys to GitHub Pages:
# https://xer0yootz.github.io/neon-vigil-oauth/
# Sign-in on Pages is Google Identity Services, all in the browser. Set the repo variable GOOGLE_CLIENT_ID
# (Settings > Secrets and variables > Actions > Variables). It is a public OAuth client ID, not a secret.
# Never add API keys or client secrets here: everything in this build is public.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: web
        env:
          VITE_BASE: /neon-vigil-oauth/
          VITE_AUTH_MODE: google
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
