<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <defs>
    <linearGradient id="core" x1="8" y1="6" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#164D70" stop-opacity=".94"/>
      <stop offset="1" stop-color="#17123F" stop-opacity=".96"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
