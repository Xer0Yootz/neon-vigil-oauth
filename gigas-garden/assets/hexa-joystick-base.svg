<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="rim" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DFBFF"/>
      <stop offset=".48" stop-color="#08CADF"/>
      <stop offset="1" stop-color="#5144B5"/>
    </linearGradient>
    <linearGradient id="glass" x1="24" y1="18" x2="102" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123D61" stop-opacity=".58"/>
      <stop offset="1" stop-color="#10102F" stop-opacity=".72"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Soft hexagonal halo -->
  <path d="M64 8 L112 36 L112 92 L64 120 L16 92 L16 36 Z" stroke="#22E8F5" stroke-width="5" opacity=".45" filter="url(#glow)"/>

  <!-- Outer data-glass hexagon -->
  <path d="M64 8 L112 36 L112 92 L64 120 L16 92 L16 36 Z" fill="url(#glass)" stroke="url(#rim)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inset hexagonal channel -->
  <path d="M64 17 L104 40 L104 88 L64 111 L24 88 L24 40 Z" stroke="#38EBEE" stroke-opacity=".62" stroke-width="1.3"/>

  <!-- Angular crystalline facets -->
  <path d="M64 17 L64 30 L35 47 L24 40" stroke="#65F5FF" stroke-opacity=".65"/>
  <path d="M104 40 L93 47 L93 81 L104 88" stroke="#2389CB" stroke-opacity=".8"/>
  <path d="M24 88 L35 81 L64 98 L64 111" stroke="#6254C8" stroke-opacity=".9"/>

  <!-- Inner control clearance -->
  <path d="M64 32 L92 48 L92 80 L64 96 L36 80 L36 48 Z" fill="#060D23" fill-opacity=".30" stroke="#19C9E4" stroke-opacity=".42" stroke-width="1.5"/>

  <!-- Six short calibration accents -->
  <g stroke="#7CFBFF" stroke-width="2.6" stroke-linecap="round">
    <path d="M64 12 V21"/>
    <path d="M108 39 L100 44"/>
    <path d="M108 89 L100 84"/>
    <path d="M64 116 V107"/>
    <path d="M20 89 L28 84"/>
    <path d="M20 39 L28 44"/>
  </g>

  <!-- Indigo corner facets -->
  <g fill="#4944A9" fill-opacity=".58">
    <path d="M64 111 L78 103 L64 98 Z"/>
    <path d="M24 88 L35 81 L35 94 Z"/>
    <path d="M104 88 L93 81 L93 94 Z"/>
  </g>
</svg>
